openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.5.0
  description: بوابة الموافقات API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health check
  - name: auth
    description: Authentication
  - name: templates
    description: Consent template management
  - name: fields
    description: Template field mapping
  - name: consents
    description: Generated consent management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current session
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /templates:
    get:
      operationId: listTemplates
      tags: [templates]
      summary: List all consent templates
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Templates list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentTemplateList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /templates/{id}:
    get:
      operationId: getTemplate
      tags: [templates]
      summary: Get a single consent template
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Template details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteTemplate
      tags: [templates]
      summary: Delete a consent template
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Template deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /templates/{templateId}/fields:
    get:
      operationId: listFields
      tags: [fields]
      summary: List all fields for a template
      security:
        - sessionAuth: []
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Fields list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateFieldList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createField
      tags: [fields]
      summary: Add a field to a template
      security:
        - sessionAuth: []
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFieldInput"
      responses:
        "201":
          description: Field created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateField"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /templates/{templateId}/fields/{fieldId}:
    put:
      operationId: updateField
      tags: [fields]
      summary: Update a template field
      security:
        - sessionAuth: []
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: integer
        - name: fieldId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFieldInput"
      responses:
        "200":
          description: Field updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateField"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteField
      tags: [fields]
      summary: Delete a template field
      security:
        - sessionAuth: []
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: integer
        - name: fieldId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Field deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /consents:
    get:
      operationId: listConsents
      tags: [consents]
      summary: List all generated consents
      security:
        - sessionAuth: []
      responses:
        "200":
          description: List of consents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /consents/generate:
    post:
      operationId: generateConsent
      tags: [consents]
      summary: Generate a filled consent PDF
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateConsentInput"
      responses:
        "201":
          description: Consent generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /consents/{id}:
    get:
      operationId: getConsent
      tags: [consents]
      summary: Get a consent by ID
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Consent record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteConsent
      tags: [consents]
      summary: Delete a consent record and its file
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Consent deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /consents/{id}/file:
    get:
      operationId: getConsentFile
      tags: [consents]
      summary: Stream the generated PDF file
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PDF file stream
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6

    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
          maxLength: 72

    AuthUser:
      type: object
      required: [id, name, email, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time

    ConsentTemplate:
      type: object
      required: [id, name, fileName, fileSize, mimeType, createdBy, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        fileName:
          type: string
        fileSize:
          type: integer
        mimeType:
          type: string
        createdBy:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ConsentTemplateList:
      type: object
      required: [templates]
      properties:
        templates:
          type: array
          items:
            $ref: "#/components/schemas/ConsentTemplate"

    TemplateField:
      type: object
      required: [id, templateId, fieldKey, label, type, pageNumber, xPercent, yPercent, widthPercent, heightPercent, required, createdAt, updatedAt]
      properties:
        id:
          type: integer
        templateId:
          type: integer
        fieldKey:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [text, date, signature]
        pageNumber:
          type: integer
          minimum: 1
        xPercent:
          type: number
          minimum: 0
          maximum: 100
        yPercent:
          type: number
          minimum: 0
          maximum: 100
        widthPercent:
          type: number
          minimum: 0
          maximum: 100
        heightPercent:
          type: number
          minimum: 0
          maximum: 100
        required:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TemplateFieldList:
      type: object
      required: [fields]
      properties:
        fields:
          type: array
          items:
            $ref: "#/components/schemas/TemplateField"

    CreateFieldInput:
      type: object
      required: [fieldKey, label, type, pageNumber, xPercent, yPercent, widthPercent, heightPercent]
      properties:
        fieldKey:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [text, date, signature]
        pageNumber:
          type: integer
          minimum: 1
        xPercent:
          type: number
          minimum: 0
          maximum: 100
        yPercent:
          type: number
          minimum: 0
          maximum: 100
        widthPercent:
          type: number
          minimum: 0
          maximum: 100
        heightPercent:
          type: number
          minimum: 0
          maximum: 100
        required:
          type: boolean

    UpdateFieldInput:
      type: object
      properties:
        xPercent:
          type: number
          minimum: 0
          maximum: 100
        yPercent:
          type: number
          minimum: 0
          maximum: 100
        widthPercent:
          type: number
          minimum: 0
          maximum: 100
        heightPercent:
          type: number
          minimum: 0
          maximum: 100
        pageNumber:
          type: integer
          minimum: 1
        label:
          type: string
        required:
          type: boolean

    GenerateConsentInput:
      type: object
      required: [templateId, fieldValues]
      properties:
        templateId:
          type: integer
        fieldValues:
          type: object
          additionalProperties:
            type: string
          description: Map of fieldKey to string value for each non-signature template field
        signature:
          type: string
          nullable: true
          description: Base64 data URL of the drawn signature (PNG)

    ConsentRecord:
      type: object
      required: [id, templateId, templateName, patientName, consentDate, generatedFileName, createdAt, updatedAt]
      properties:
        id:
          type: integer
        templateId:
          type: integer
        templateName:
          type: string
        patientName:
          type: string
        patientId:
          type: string
          nullable: true
        patientPhone:
          type: string
          nullable: true
        procedureName:
          type: string
          nullable: true
        doctorName:
          type: string
          nullable: true
        consentDate:
          type: string
        notes:
          type: string
          nullable: true
        generatedFileName:
          type: string
        createdBy:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ConsentList:
      type: object
      required: [consents]
      properties:
        consents:
          type: array
          items:
            $ref: "#/components/schemas/ConsentRecord"

    SuccessMessage:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: consent.sid
